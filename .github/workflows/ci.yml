name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  CI:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      # Required to comment on a pull request
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Build and test
        run: |
          corepack enable
          yarn --frozen-lockfile
          yarn clean
          yarn build
          yarn test
          pushd target
          zip -qr ../elasticsearch-node-rotation.zip ./
          popd

      - name: Riff-Raff upload
        uses: guardian/actions-riff-raff@9b7f9fe778957e6dc3ef4ab70fec015119ccba83 # v.4.3.7
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          projectName: elasticsearch-node-rotation
          configPath: ./riff-raff.yaml
          buildNumberOffset: 367
          commentingStage: INFRA
          contentDirectories: |
            elasticsearch-node-rotation:
              - elasticsearch-node-rotation.zip
            elasticsearch-node-rotation-cloudformation:
              - cloudformation.yaml
